<style>

.s-solid{--bgs:var(--solid);--bds:var(--a-solid)}

header{flex-wrap:wrap}

.cell.star::after{content:"★";position:absolute;top:2px;right:4px;color:#ffd23f;font-size:15px;line-height:1}
</style></head>
