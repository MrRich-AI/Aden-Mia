<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aden &amp; Mia's Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050818;--ink:#f4f8ff;--line:rgba(160,205,255,.45);--gold:#ffd25e;--pink:#ff7ac8;--cyan:#5ee6ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif;overflow-x:hidden}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 48px}
header{text-align:center;margin:4vh 0 5vh}
h1{margin:0;font-size:clamp(40px,9vw,88px);line-height:1;letter-spacing:.5px;
  background:linear-gradient(180deg,#fff,#ffd25e 55%,#ff8f3a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #2a1460) drop-shadow(0 8px 18px #000a)}
.sub{margin-top:12px;font-size:clamp(17px,3.4vw,24px);font-weight:600;color:#cfe3ff;text-shadow:0 2px 6px #000}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),300px));justify-content:center;gap:20px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px 20px 20px;border-radius:24px;text-decoration:none;color:var(--ink);
  background:linear-gradient(160deg,#1f3a8a,#0d1747 70%);border:2px solid var(--line);
  box-shadow:0 10px 30px #0009,inset 0 1px 0 #ffffff30;transition:transform .2s,box-shadow .2s;animation:pop .5s backwards}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 16px 40px #000b,0 0 0 3px var(--gold);outline:none}
.tile:active{transform:scale(.97)}
.icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;
  background:radial-gradient(circle at 32% 28%,#fff8,transparent 45%),radial-gradient(circle,var(--c1),var(--c2));box-shadow:0 6px 14px #0008}
.name{font-size:26px;font-weight:700;line-height:1.1}
.desc{font-size:16px;color:#d6e4ff;line-height:1.3}
.play{margin-top:auto;align-self:flex-start;padding:8px 18px;border-radius:999px;font-weight:700;font-size:17px;color:#2a1600;
  background:linear-gradient(180deg,#ffe68a,#ffb52e);box-shadow:0 3px 0 #a5630a}
#status{text-align:center;color:#cfe3ff;font-size:18px;margin-top:20px}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.95)}}
@media (prefers-reduced-motion:reduce){.tile{animation:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <header>
    <h1>Aden &amp; Mia</h1>
    <div class="sub">Pick a game and blast off! 🚀</div>
  </header>
  <div id="grid"></div>
  <div id="status"></div>
</main>
<script>
/* ---------- Builds ----------
   Every folder in this repo that has an index.html shows up here automatically.
   Add an entry below to give a build a nicer name, icon, colours or description.
   Order: entries listed here come first (in this order), new folders are added after. */
const BUILDS = [
  { folder:"crazy-continents", name:"Crazy Continents", icon:"🌍", desc:"Explore the seven continents!", c1:"#3fd28a", c2:"#1565c0" },
  { folder:"epic-elements", name:"Epic Elements of the Periodic Table", icon:"⚛️", desc:"Zoom around the periodic table and explore every element!", c1:"#33ff66", c2:"#0b3d1a" }
];
const OWNER = "mrrich-ai", REPO = "Aden-Mia";
const PALETTE = [["#ff7ac8","#7b1fa2"],["#ffd25e","#e65100"],["#5ee6ff","#283593"],["#9cff6e","#2e7d32"],["#ff8a65","#b71c1c"]];
const ICONS = ["⭐","🪐","🎈","🦖","🚂","🎨","🐳"];

const grid = document.getElementById("grid"), status = document.getElementById("status");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pretty = f => f.replace(/[-_]+/g," ").replace(/\b\w/g, m => m.toUpperCase());

function render(list){
  grid.innerHTML = list.map((b,i) => {
    const p = PALETTE[i % PALETTE.length];
    return '<a class="tile" href="'+encodeURIComponent(b.folder)+'/" style="--c1:'+(b.c1||p[0])+';--c2:'+(b.c2||p[1])+';animation-delay:'+(i*.08)+'s">' +
      '<div class="icon" aria-hidden="true">'+esc(b.icon||ICONS[i % ICONS.length])+'</div>' +
      '<div class="name">'+esc(b.name||pretty(b.folder))+'</div>' +
      (b.desc ? '<div class="desc">'+esc(b.desc)+'</div>' : '') +
      '<span class="play">Play ▶</span></a>';
  }).join("");
  status.textContent = list.length ? "" : "No games yet — check back soon!";
}

render(BUILDS); // show known builds straight away
fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/", {headers:{Accept:"application/vnd.github+json"}})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(items => {
    const dirs = items.filter(x => x.type === "dir" && !x.name.startsWith(".")).map(x => x.name);
    const known = BUILDS.filter(b => dirs.includes(b.folder));
    const extra = dirs.filter(d => !BUILDS.some(b => b.folder === d)).map(d => ({folder:d}));
    render(known.concat(extra));
  })
  .catch(() => {}); // offline / rate-limited: keep the built-in list

/* ---------- Painterly space scene ---------- */
const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
let W, H, stars = [], planets = [], comets = [], t = 0;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function rnd(a,b){ return a + Math.random()*(b-a); }
function setup(){
  const d = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
  stars = Array.from({length: Math.round(W*H/2600)}, () => ({x:rnd(0,W), y:rnd(0,H), r:rnd(.4,1.8), p:rnd(0,6.28), s:rnd(.5,2)}));
  const m = Math.min(W,H);
  planets = [
    {x:W*.12, y:H*.78, r:m*.16, a:"#ffb36b", b:"#c2410c", c:"#5a1a05", ring:true, bands:5},
    {x:W*.9,  y:H*.2,  r:m*.1,  a:"#8fe3ff", b:"#2563eb", c:"#0b1e5c", ring:false, bands:3},
    {x:W*.78, y:H*.88, r:m*.06, a:"#e9b8ff", b:"#9333ea", c:"#3b0764", ring:false, bands:2}
  ];
}
function nebula(){
  const blobs = [[.25,.3,"#7b2ff7"],[.75,.55,"#ff4fa3"],[.5,.9,"#1fb6ff"],[.85,.1,"#3d5afe"]];
  blobs.forEach(([x,y,c],i) => {
    const R = Math.max(W,H)*.45, cx = W*x + Math.sin(t*.0003+i)*30, cy = H*y + Math.cos(t*.0004+i)*20;
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    g.addColorStop(0,c+"55"); g.addColorStop(.5,c+"1c"); g.addColorStop(1,c+"00");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  });
}
function planet(p,i){
  const bob = Math.sin(t*.0008+i*2)*6, x = p.x, y = p.y+bob;
  if(p.ring){ ctx.save(); ctx.translate(x,y); ctx.rotate(-.35); ctx.strokeStyle="#ffe2b080"; ctx.lineWidth=p.r*.09;
    ctx.beginPath(); ctx.ellipse(0,0,p.r*1.65,p.r*.42,0,Math.PI,2*Math.PI); ctx.stroke(); ctx.restore(); }
  const g = ctx.createRadialGradient(x-p.r*.35,y-p.r*.4,p.r*.1,x,y,p.r);
  g.addColorStop(0,p.a); g.addColorStop(.6,p.b); g.addColorStop(1,p.c);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,p.r,0,7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,p.r,0,7); ctx.clip(); ctx.globalAlpha=.18;
  for(let k=0;k<p.bands;k++){ ctx.fillStyle = k%2 ? "#fff" : "#000"; ctx.beginPath();
    ctx.ellipse(x, y-p.r+(k+.6)*(2*p.r/p.bands), p.r*1.2, p.r*.09, -.12, 0, 7); ctx.fill(); }
  ctx.restore();
  if(p.ring){ ctx.save(); ctx.translate(x,y); ctx.rotate(-.35); ctx.strokeStyle="#ffe2b0b0"; ctx.lineWidth=p.r*.09;
    ctx.beginPath(); ctx.ellipse(0,0,p.r*1.65,p.r*.42,0,0,Math.PI); ctx.stroke(); ctx.restore(); }
}
function frame(ts){
  t = ts||0;
  ctx.fillStyle = "#050818"; ctx.fillRect(0,0,W,H);
  nebula();
  stars.forEach(s => { ctx.globalAlpha = .45+.55*Math.abs(Math.sin(t*.001*s.s+s.p)); ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); });
  ctx.globalAlpha = 1;
  planets.forEach(planet);
  if(!still && Math.random() < .006) comets.push({x:rnd(W*.2,W), y:rnd(0,H*.4), v:rnd(6,10), life:1});
  comets = comets.filter(c => c.life > 0);
  comets.forEach(c => { c.x -= c.v; c.y += c.v*.45; c.life -= .015;
    const g = ctx.createLinearGradient(c.x,c.y,c.x+90,c.y-40); g.addColorStop(0,"rgba(255,255,255,"+c.life+")"); g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.strokeStyle = g; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x+90,c.y-40); ctx.stroke(); });
  if(!still) requestAnimationFrame(frame);
}
addEventListener("resize", () => { setup(); if(still) frame(0); });
setup(); requestAnimationFrame(frame);
</script>
</body>
</html>
