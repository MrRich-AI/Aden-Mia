<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoomable USA Map</title>
<style>
:root{--sea:#dfe9ee;--land:#f2ecdc;--line:#7b8a8f;--hi:#e0b25a;--ink:#23323a;--panel:#fffdf6;--edge:#b9c4c8;--wl:#3f7192;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wl:#7fb0cf;--sea:#14202a;--land:#2b3a43;--line:#5d727c;--hi:#c9953a;--ink:#e6edf0;--panel:#1c2a33;--edge:#3b4d57}}
:root[data-theme="dark"]{--wl:#7fb0cf;--sea:#14202a;--land:#2b3a43;--line:#5d727c;--hi:#c9953a;--ink:#e6edf0;--panel:#1c2a33;--edge:#3b4d57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
#map{position:absolute;inset:0;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.datamaps-subunit{vector-effect:non-scaling-stroke}
.datamaps-subunit path,path.datamaps-subunit{vector-effect:non-scaling-stroke}
.ctx path{fill:var(--land);fill-opacity:.3;stroke:var(--line);stroke-opacity:.3;stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.lake{fill:var(--sea);stroke:var(--line);stroke-width:.6;stroke-opacity:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.lbl text,.terr text{pointer-events:none;fill:var(--ink);font-family:Georgia,serif;stroke:var(--sea);stroke-width:3px;paint-order:stroke;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lbl .c{font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill-opacity:.55}
.lbl .w{font-style:italic;letter-spacing:.12em;fill:var(--wl)}
.terr circle{fill:var(--hi);stroke:var(--ink);stroke-width:1.2px;vector-effect:non-scaling-stroke;cursor:pointer}
.terr path{fill:var(--land);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke;cursor:pointer}
.opts{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:8px 12px;font:13px system-ui,sans-serif}
.opts summary{cursor:pointer;font-weight:600}
.opts label{display:block;margin-top:6px;cursor:pointer}
.bar{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:8px 12px;max-width:70vw}
.bar h1{font-size:17px;margin:0}
.bar p{font:13px/1.3 system-ui,sans-serif;margin:3px 0 0;opacity:.8}
.ctl{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:6px}
.ctl button{width:44px;height:44px;font:22px system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:6px;cursor:pointer}
.ctl button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar"><h1 id="name">United States</h1><p id="hint">Pinch or scroll to zoom. Drag to pan. Click a state for its name.</p></div>
<div class="ctl"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">&minus;</button><button id="zr" aria-label="Reset view">&#8634;</button></div>
<details class="opts"><summary>Territories</summary>
<label><input type="checkbox" data-t="dc"> Washington, D.C.</label>
<label><input type="checkbox" data-t="pr"> Puerto Rico</label>
<label><input type="checkbox" data-t="gu"> Guam</label>
<label><input type="checkbox" data-t="vi"> U.S. Virgin Islands</label>
<label><input type="checkbox" data-t="mp"> N. Mariana Islands</label>
<label><input type="checkbox" data-t="as"> American Samoa</label>
</details>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.hires.min.js"></script>
<script>window.WorldTopo=window.Datamap&&Datamap.prototype.worldTopo;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.usa.min.js"></script>
<script>
(function(){
  var css=function(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();};
  var topo=Datamap.prototype.usaTopo, WT=window.WorldTopo, U=1000, map, svg, zoom, curP, sc=1, dn=null, sel={dc:1,pr:1,gu:1,vi:0,mp:0,as:0};
  var NA={CAN:1,MEX:1,GTM:1,BLZ:1,SLV:1,HND:1,NIC:1,CRI:1,PAN:1,CUB:1,JAM:1,HTI:1,DOM:1,BHS:1,PRI:1,TTO:1,BRB:1,LCA:1,VCT:1,GRD:1,ATG:1,KNA:1,DMA:1,CYM:1,TCA:1,VGB:1,VIR:1,AIA:1,MSR:1,GLP:1,MTQ:1,BMU:1,GRL:1,SPM:1,ABW:1,CUW:1,BES:1,SXM:1,MAF:1,BLM:1};
  function isHI(d){return d&&(d.id==='HI'||(d.properties&&d.properties.name==='Hawaii'));}
  // One Lambert azimuthal equal-area projection centred on North America (100°W, 45°N): Alaska and Hawaii keep the lower 48's scale.
  // Alaska and Hawaii both sit at their true positions.
  function build(el){
    var w=el.offsetWidth,h=el.offsetHeight;
    var mk=function(){return d3.geo.azimuthalEqualArea().rotate([100,-45]).scale(U).translate([0,0]);};
    var P=mk(), c=P([-118.3,33.9]), hw=P([-157.0,20.5]);
    var dx=0, dy=0;
    var pm=d3.geo.path().projection(P), ph=d3.geo.path().projection(mk().translate([dx,dy]));
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    topojson.feature(topo,topo.objects.usa).features.forEach(function(f){
      var b=(isHI(f)?ph:pm).bounds(f);
      x0=Math.min(x0,b[0][0]);y0=Math.min(y0,b[0][1]);x1=Math.max(x1,b[1][0]);y1=Math.max(y1,b[1][1]);
    });
    var k=0.94/Math.max((x1-x0)/w,(y1-y0)/h), t=[(w-k*(x0+x1))/2,(h-k*(y0+y1))/2];
    var Pm=d3.geo.azimuthalEqualArea().rotate([100,-45]).scale(U*k).translate(t);
    var Ph=d3.geo.azimuthalEqualArea().rotate([100,-45]).scale(U*k).translate([t[0]+dx*k,t[1]+dy*k]);
    var pM=d3.geo.path().projection(Pm), pH=d3.geo.path().projection(Ph);
    var pick=function(d){return isHI(d)?pH:pM;};
    var f=function(d,i){return pick(d)(d,i);};
    ['centroid','bounds','area'].forEach(function(n){f[n]=function(d){return pick(d)[n](d);};});
    f.projection=function(){return Pm;};
    curP=Pm;
    return {path:f,projection:Pm};
  }
  function init(){
    var el=document.getElementById('map'); el.innerHTML='';
    map=new Datamap({
      element:el, scope:'usa', responsive:false, setProjection:build,
      fills:{defaultFill:css('--land')},
      geographyConfig:{borderColor:css('--line'),borderWidth:0.8,highlightFillColor:css('--hi'),highlightBorderColor:css('--ink'),popupOnHover:false,highlightOnHover:true}
    });
    svg=map.svg;
    if(WT){
      var lp=d3.geo.path().projection(curP);
      var cf=topojson.feature(WT,WT.objects.world).features.filter(function(f){return NA[f.id];});
      svg.insert('g',':first-child').attr('class','ctx').selectAll('path').data(cf).enter().append('path').attr('d',lp);
    }
    zoom=d3.behavior.zoom().scaleExtent([1,60]).on('zoom',function(){
      svg.selectAll('g').filter(function(){return this.parentNode===svg.node();}).attr('transform','translate('+d3.event.translate+')scale('+d3.event.scale+')');
      sc=d3.event.scale;scaleUI();
    });
    svg.call(zoom).on('dblclick.zoom',null);
    el.onmousedown=function(e){dn={x:e.clientX,y:e.clientY,t:Date.now()};};
    el.addEventListener('touchstart',function(e){var p=e.touches[0];dn={x:p.clientX,y:p.clientY,t:Date.now()};},{passive:true});
    layers();
    svg.selectAll('.datamaps-subunit').on('click',function(g){
      if(real(d3.event))document.getElementById('name').textContent=g.properties.name;
    });
  }
  // A click only counts if the pointer barely moved and was quick (ignores drags and stray trackpad taps).
  function real(e){return !!dn&&Math.abs(e.clientX-dn.x)+Math.abs(e.clientY-dn.y)<6&&Date.now()-dn.t<600;}
  function on(k){return !k||(k==='inset'?(sel.gu||sel.mp||sel.as):sel[k]);}
  function scaleUI(){
    var vis=function(){return on(this.getAttribute('data-t'))?null:'none';};
    svg.selectAll('.terr circle').attr('r',5/sc).style('display',vis);
    svg.selectAll('.terr path').style('display',vis);
    svg.selectAll('.terr text, .lbl text').each(function(){
      var t=d3.select(this);
      t.attr('x',+t.attr('data-x')+(+t.attr('data-dx'))/sc).attr('y',+t.attr('data-y')+(+t.attr('data-dy'))/sc)
       .style('font-size',(+t.attr('data-s')/sc)+'px')
       .style('display',(sc>=+t.attr('data-z')&&on(t.attr('data-t')))?null:'none');
    });
  }
  var LK=[
   [[-92.1,46.8],[-90.9,46.95],[-90.4,46.58],[-89.1,46.85],[-88.4,47.3],[-87.9,47.45],[-87.4,46.5],[-86.0,46.65],[-85.0,46.75],[-84.6,46.45],[-84.8,47.0],[-84.8,47.85],[-85.9,48.2],[-86.5,48.8],[-88.3,48.85],[-89.2,48.35],[-90.5,48.1],[-91.6,47.7]],
   [[-87.3,41.62],[-86.8,41.75],[-86.25,42.1],[-86.3,43.0],[-86.5,43.7],[-86.25,44.7],[-85.6,45.05],[-85.0,45.4],[-84.75,45.78],[-85.5,46.05],[-86.2,45.95],[-86.8,45.7],[-87.0,45.3],[-87.4,44.6],[-87.7,43.8],[-87.9,43.05],[-87.8,42.3],[-87.55,41.85]],
   [[-84.7,45.9],[-83.6,45.95],[-83.3,45.3],[-83.3,44.5],[-83.9,43.9],[-83.0,44.05],[-82.5,43.2],[-82.45,43.0],[-81.7,43.7],[-81.7,44.4],[-81.3,44.8],[-81.5,45.25],[-80.9,45.0],[-80.1,44.5],[-80.2,45.5],[-81.0,46.0],[-81.9,46.1],[-83.0,46.2],[-84.0,46.2]],
   [[-83.45,41.7],[-82.9,41.5],[-82.0,41.5],[-81.7,41.55],[-80.5,41.95],[-79.5,42.5],[-78.9,42.85],[-79.1,42.85],[-80.0,42.75],[-81.2,42.65],[-82.1,42.45],[-83.0,42.05]],
   [[-79.8,43.3],[-79.2,43.25],[-78.0,43.35],[-77.0,43.3],[-76.2,43.55],[-76.2,44.0],[-76.5,44.1],[-77.0,44.1],[-78.0,43.9],[-79.0,43.85]]
  ];
  // [name, lon, lat, min zoom, class: c=country, w=water]
  var LB=[
   ['Canada',-105,58,1,'c'],['Mexico',-102,24,1,'c'],['Greenland',-42,73,1,'c'],['Cuba',-79.5,21.8,2,'c'],['Bahamas',-77,25,3,'c'],
   ['Guatemala',-90.4,15.6,3.5,'c'],['Belize',-88.7,17.2,5,'c'],['Honduras',-86.6,14.9,3,'c'],['El Salvador',-88.9,13.7,5,'c'],['Nicaragua',-85.2,12.9,3,'c'],
   ['Costa Rica',-84.2,10,3.5,'c'],['Panama',-80.1,8.6,3,'c'],['Haiti',-72.8,19,4,'c'],['Dominican Rep.',-70.4,18.9,4,'c'],['Jamaica',-77.3,18.1,4,'c'],
   ['Trinidad & Tobago',-61.3,10.5,5,'c'],['Bermuda',-64.8,32.3,3,'c'],
   ['Pacific Ocean',-138,36,1,'w'],['Atlantic Ocean',-60,36,1,'w'],['Arctic Ocean',-150,77,1,'w'],['Gulf of Mexico',-90.5,25.2,1.2,'w'],['Caribbean Sea',-76,15,1.2,'w'],
   ['Gulf of Alaska',-146,57.5,1.5,'w'],['Bering Sea',-177,59,1.5,'w'],['Hudson Bay',-85,60,1.5,'w'],['Labrador Sea',-52,57,1.5,'w'],['Beaufort Sea',-135,72,2,'w'],
   ['Gulf of California',-110,27,3,'w'],['Gulf of St. Lawrence',-62,48,3,'w']
  ];
  function layers(){
    sc=1;
    var el=document.getElementById('map'),w=el.offsetWidth,h=el.offsetHeight,lp=d3.geo.path().projection(curP);
    // Great Lakes drawn in water colour over the land layers (approximate shorelines).
    var gl=svg.append('g').attr('class','lakes');
    LK.forEach(function(r){
      var a=0,i,n=r.length;for(i=0;i<n;i++){var p=r[i],q=r[(i+1)%n];a+=p[0]*q[1]-q[0]*p[1];}
      var ring=(a>0?r.slice().reverse():r.slice());ring.push(ring[0]);
      gl.append('path').attr('class','lake').attr('d',lp({type:'Polygon',coordinates:[ring]}));
    });
    // Territories: true position where practical; Pacific ones as an inset near Hawaii.
    var T=svg.append('g').attr('class','terr'), H=curP([-157,20.5]);
    var x0=Math.max(0.05*w,H[0]-0.02*w), y0=Math.min(H[1]+0.07*h,0.80*h), ins=0;
    var TD=[{k:'dc',n:'Washington, D.C.',ll:[-77.04,38.9],z:3},{k:'vi',n:'U.S. Virgin Islands',ll:[-64.85,18.34],z:4},{k:'pr',n:'Puerto Rico',ll:[-66.5,18.2],z:3,poly:1},
      {k:'gu',n:'Guam',inset:1,z:1},{k:'mp',n:'N. Mariana Islands',inset:1,z:1},{k:'as',n:'American Samoa',inset:1,z:1}];
    var say=function(n){return function(){if(real(d3.event))document.getElementById('name').textContent=n;};};
    TD.forEach(function(d){
      var pos=d.inset?[x0,y0+(ins++)*0.045*h]:curP(d.ll);
      if(d.poly&&WT){
        topojson.feature(WT,WT.objects.world).features.filter(function(f){return f.id==='PRI';}).forEach(function(f){
          T.append('path').attr('data-t',d.k).attr('d',lp(f)).on('click',say(d.n));
        });
      } else T.append('circle').attr('data-t',d.k).attr('cx',pos[0]).attr('cy',pos[1]).on('click',say(d.n));
      T.append('text').text(d.n).attr('data-t',d.k).attr('data-x',pos[0]).attr('data-y',pos[1]).attr('data-dx',8).attr('data-dy',4).attr('data-z',d.z).attr('data-s',11);
    });
    T.append('text').text('Pacific territories (inset, not to location)').attr('data-t','inset').attr('data-x',x0-6).attr('data-y',y0-0.03*h).attr('data-dx',0).attr('data-dy',0).attr('data-z',1).attr('data-s',10);
    var L=svg.append('g').attr('class','lbl');
    LB.forEach(function(d){
      var p=curP([d[1],d[2]]);
      L.append('text').attr('class',d[4]).attr('text-anchor','middle').text(d[0]).attr('data-x',p[0]).attr('data-y',p[1]).attr('data-dx',0).attr('data-dy',0).attr('data-z',d[3]).attr('data-s',d[4]==='w'?12:11);
    });
    scaleUI();
  }
  function step(f){
    var r=document.getElementById('map').getBoundingClientRect(),k=zoom.scale(),k2=Math.max(1,Math.min(60,k*f)),t=zoom.translate(),c=[r.width/2,r.height/2];
    var x=(c[0]-t[0])/k,y=(c[1]-t[1])/k;
    zoom.scale(k2).translate([c[0]-x*k2,c[1]-y*k2]);
    zoom.event(svg.transition().duration(300));
  }
  document.getElementById('zi').onclick=function(){step(2);};
  document.getElementById('zo').onclick=function(){step(0.5);};
  document.getElementById('zr').onclick=function(){
    zoom.scale(1).translate([0,0]);zoom.event(svg.transition().duration(400));
    document.getElementById('name').textContent='United States';
  };
  [].forEach.call(document.querySelectorAll('.opts input'),function(c){
    c.checked=!!sel[c.getAttribute('data-t')];
    c.onchange=function(){sel[c.getAttribute('data-t')]=c.checked?1:0;scaleUI();};
  });
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(init,200);});
  init();
})();
</script>
</body>
</html>
