<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoomable USA Map</title>
<style>
:root{--sea:#c4dbe8;--land:#f7f1e1;--other:#d9d3c3;--oline:#8a8f86;--line:#7b8a8f;--hi:#e0b25a;--ink:#23323a;--panel:#fffdf6;--edge:#b9c4c8;--wl:#2f6386;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wl:#8cbcdb;--sea:#0f1a22;--land:#3a4c57;--other:#25313a;--oline:#5a6a72;--line:#6d838d;--hi:#c9953a;--ink:#e6edf0;--panel:#1c2a33;--edge:#3b4d57}}
:root[data-theme="dark"]{--wl:#8cbcdb;--sea:#0f1a22;--land:#3a4c57;--other:#25313a;--oline:#5a6a72;--line:#6d838d;--hi:#c9953a;--ink:#e6edf0;--panel:#1c2a33;--edge:#3b4d57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
#map{position:absolute;inset:0;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.datamaps-subunit{vector-effect:non-scaling-stroke}
.datamaps-subunit path,path.datamaps-subunit{vector-effect:non-scaling-stroke}
#map .ctx path{fill:var(--other);stroke:var(--oline);stroke-width:.7;vector-effect:non-scaling-stroke;pointer-events:none}
#map .lake{fill:var(--sea);stroke:var(--line);stroke-width:.7;vector-effect:non-scaling-stroke;fill-rule:evenodd}
.sab text{pointer-events:none;fill:var(--ink);font:700 15px system-ui,sans-serif;letter-spacing:.04em;stroke:var(--land);stroke-width:3px;paint-order:stroke;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.terr .mk{cursor:pointer}
#map .terr .mk circle{fill:var(--hi);stroke:var(--ink);stroke-width:1.2px;vector-effect:non-scaling-stroke}
#map .terr .mk .star{fill:var(--ink);stroke:none}
#map .terr .mk.on circle{fill:var(--ink)}
#map .terr .mk.on .star{fill:var(--hi)}
#map .terr path.on{fill:var(--hi)}
.lbl text,.terr text{pointer-events:none;fill:var(--ink);font-family:Georgia,serif;stroke:var(--sea);stroke-width:3px;paint-order:stroke;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lbl .c{font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill-opacity:.55}
.lbl .w{font-style:italic;letter-spacing:.12em;fill:var(--wl)}
#map .terr path{fill:var(--land);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke;cursor:pointer}
.side{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:46vw}
.opts{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:8px 12px;font:13px system-ui,sans-serif}
.opts summary{cursor:pointer;font-weight:600}
.opts label{display:block;margin-top:6px;cursor:pointer}
[hidden]{display:none!important}
.act button{margin-top:6px;width:100%;padding:8px 10px;font:600 13px system-ui,sans-serif;color:var(--ink);background:var(--land);border:1px solid var(--edge);border-radius:6px;cursor:pointer}
.act button[aria-pressed="true"]{background:var(--hi)}
#quiz{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(440px,calc(100vw - 150px));box-sizing:border-box;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 16px;text-align:center;font-family:system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#quiz .q{font:700 22px Georgia,serif}
#quiz .fb{min-height:26px;margin:8px 0;font-weight:700;font-size:17px}
#quiz .fb.ok{color:#2e9e57;animation:pop .5s ease}
#quiz .fb.no{color:#d9534f;animation:shake .45s}
#quiz .row{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px}
#quiz button{padding:7px 14px;font:600 14px system-ui,sans-serif;border:1px solid var(--edge);border-radius:6px;background:var(--hi);color:var(--ink);cursor:pointer}
#quiz #qexit{background:transparent}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fl{50%{fill-opacity:.35}}
.flash{animation:fl .6s ease 3}
.bar{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:8px 12px;max-width:70vw}
.bar h1{font-size:17px;margin:0}
.bar p{font:13px/1.3 system-ui,sans-serif;margin:3px 0 0;opacity:.8}
.ctl{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:6px}
.ctl button{width:44px;height:44px;font:22px system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:6px;cursor:pointer}
.ctl button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
/* ---- State card (flag-colour style): fixed 1200x800 design, scaled to fit the screen ---- */
#cardov{position:fixed;inset:0;z-index:50}
#cardov .cbk{position:absolute;inset:0;background:rgba(10,18,24,.62);animation:cfade .25s ease}
#cardov .csc{position:absolute;left:50%;top:50%;width:1200px;height:800px;transform-origin:center}
.card{--c1:#002868;--c2:#bf0a30;width:1200px;height:800px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border:10px solid var(--c1);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:cpop .32s cubic-bezier(.2,1.3,.4,1);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card .ccol{display:grid;grid-template-rows:1fr 1fr;min-height:0;min-width:0}
.card .ccol.l{background:var(--c1)}
.card .cphoto{position:relative;overflow:hidden;border:8px solid var(--c1);min-height:0}
.card .cphoto svg{width:100%;height:100%;display:block}
.card .ctag{position:absolute;left:10px;bottom:10px;font:600 12px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;padding:5px 9px;border-radius:4px}
.card .cinfo{padding:22px 30px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;overflow:hidden}
.card .l .cinfo{color:#fff}
.card .r .cinfo{color:var(--c1);border-bottom:16px solid var(--c2)}
.card .cab{font:900 20px Inter,system-ui,sans-serif;letter-spacing:.4em;color:var(--ab)}
.card .cname{margin:0;font-size:96px;line-height:1.04;color:var(--c1);overflow-wrap:normal;word-break:keep-all;flex:none}
.card .r .cinfo{gap:8px}
.card .crow{flex:1 1 auto;min-height:0;display:flex;gap:22px;align-items:stretch;overflow:hidden}
.card .cflag{flex:0 0 46%;min-width:0;display:flex;align-items:center;justify-content:center}
.card .cflag img{width:100%;max-height:100%;object-fit:contain;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.2);background:#fff}
.card .cflag .cbars{width:100%;aspect-ratio:3/2;background:linear-gradient(var(--c1) 0 50%,var(--c2) 50% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.card .cfacts{flex:1 1 auto;min-width:0;margin:0;display:flex;flex-direction:column;justify-content:space-between;font:500 var(--fs,16px)/1.2 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d2a30}
.card .cfacts div{min-width:0}
.card .cfacts dt{font-weight:800;font-size:.66em;letter-spacing:.1em;text-transform:uppercase;color:var(--c2k);white-space:nowrap}
.card .cfacts dd{margin:.06em 0 0;font-weight:650}
.card .cfacts small{font-weight:500;opacity:.7;font-size:.8em;white-space:nowrap}
.card .l .cinfo{padding:20px 28px 22px}
.card .cstory{font:500 var(--fs,16px)/1.42 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;display:flex;flex-direction:column;gap:.45em}
.card .cstory .clbl{font-size:.68em;color:var(--onl,#fff);opacity:.85}
.card .cstory p{margin:0 0 .35em}
.card .cstory ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:.3em 1.1em;font-weight:700;line-height:1.25}
.card .cstory li{position:relative;padding-left:1.05em}
.card .cstory li::before{content:"\2605";position:absolute;left:0;top:0;color:var(--c2);font-size:.85em}
.card .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:cfade .5s ease}
a.ctag{text-decoration:none}a.ctag:hover{text-decoration:underline}
.card .clbl{font:800 12px Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--c2)}
.card .l .clbl{color:#fff}
.card .cph{display:flex;flex-direction:column;gap:9px}
.card .cph i{display:block;height:12px;border-radius:6px;opacity:.3;background:currentColor}
.card .cph i:nth-child(2){width:82%}.card .cph i:nth-child(3){width:91%}.card .cph i:nth-child(4){width:64%}
.card .cmap{background:var(--c2);padding:12px;display:grid;place-items:center;position:relative;min-height:0;overflow:hidden}
.card .cmw{position:relative}
.card .cmw img,.card .cmw svg.out{width:100%;height:100%;display:block}
.card .cmw svg.out{background:#c4dbe8}
.card .cstar{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%)}
.card .ccap{position:absolute;transform:translate(18px,-50%);font:italic 700 15px Georgia,serif;color:#1d2a30;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.card .ccap.lft{transform:translate(calc(-100% - 18px),-50%)}
.card .cwait{font:600 14px Inter,system-ui,sans-serif;color:var(--on2)}
.card .ccred{position:absolute;right:8px;bottom:6px;font:600 10px Inter,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:3px}
.card .cx{position:absolute;right:18px;top:16px;width:44px;height:44px;border-radius:50%;border:0;background:var(--c2);color:var(--on2);font:800 24px/1 Inter,system-ui,sans-serif;cursor:pointer;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.card .cx:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
@keyframes cpop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cfade{from{opacity:0}}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar"><h1 id="name">United States</h1><p id="hint">Pinch or scroll to zoom. Drag to pan. Tap a state to select it. Double-tap it for its card. Double-tap outside the USA to clear.</p></div>
<div class="ctl"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">&minus;</button><button id="zr" aria-label="Reset view">&#8634;</button></div>
<div class="side">
<details class="opts"><summary>Territories</summary>
<label><input type="checkbox" data-t="dc"> Washington, D.C.</label>
<label><input type="checkbox" data-t="pr"> Puerto Rico</label>
<label><input type="checkbox" data-t="gu"> Guam</label>
<label><input type="checkbox" data-t="vi"> U.S. Virgin Islands</label>
<label><input type="checkbox" data-t="mp"> N. Mariana Islands</label>
<label><input type="checkbox" data-t="as"> American Samoa</label>
</details>
<details class="opts act" open><summary>Activities</summary>
<button id="sas" aria-pressed="false">State and Seek</button>
</details>
</div>
<div id="quiz" hidden>
<div class="q" id="qtext"></div>
<div class="fb" id="qfb"></div>
<div class="row"><span id="qscore"></span><span><button id="qnext" hidden>Next</button> <button id="qexit">Exit</button></span></div>
</div>
<div id="cardov" hidden><div class="cbk"></div><div class="csc" role="dialog" aria-modal="true" aria-labelledby="cname"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.hires.min.js"></script>
<script>window.WorldTopo=window.Datamap&&Datamap.prototype.worldTopo;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.usa.min.js"></script>
<script>
(function(){
  var css=function(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();};
  var topo=Datamap.prototype.usaTopo, WT=window.WorldTopo, U=1000, map, svg, zoom, curP, sc=1, dn=null, sel={dc:1,pr:1,gu:1,vi:0,mp:0,as:0}, quiz={on:0,deck:[],cur:null,done:0,ok:0,n:0,bad:null,finished:0};
  var NA={CAN:1,MEX:1,GTM:1,BLZ:1,SLV:1,HND:1,NIC:1,CRI:1,PAN:1,CUB:1,JAM:1,HTI:1,DOM:1,BHS:1,PRI:1,TTO:1,BRB:1,LCA:1,VCT:1,GRD:1,ATG:1,KNA:1,DMA:1,CYM:1,TCA:1,VGB:1,VIR:1,AIA:1,MSR:1,GLP:1,MTQ:1,BMU:1,GRL:1,SPM:1,ABW:1,CUW:1,BES:1,SXM:1,MAF:1,BLM:1};
  var TD=[{k:'dc',iso:'',n:'Washington, D.C.',ll:[-77.04,38.9],z:3},{k:'pr',iso:'PRI',n:'Puerto Rico',ll:[-66.5,18.2],z:1.5},{k:'vi',iso:'VIR',n:'U.S. Virgin Islands',ll:[-64.8,18.0],z:3},
    {k:'gu',iso:'GUM',n:'Guam',ll:[144.79,13.45],z:0,dy:15},{k:'mp',iso:'MNP',n:'N. Mariana Islands',ll:[145.7,15.2],z:0,dy:-6},{k:'as',iso:'ASM',n:'American Samoa',ll:[-170.7,-14.3],z:0}];
  var TDK={},TERR_ID={};TD.forEach(function(d){TDK[d.k]=d;if(d.iso)TERR_ID[d.iso]=1;});
  function isHI(d){return d&&(d.id==='HI'||(d.properties&&d.properties.name==='Hawaii'));}
  // One Lambert azimuthal equal-area projection centred on North America (100°W, 45°N): Alaska and Hawaii keep the lower 48's scale.
  // Alaska and Hawaii both sit at their true positions.
  function build(el){
    var w=el.offsetWidth,h=el.offsetHeight;
    var mk=function(){return d3.geo.azimuthalEqualArea().rotate([100,-45]).scale(U).translate([0,0]);};
    var P=mk(), c=P([-118.3,33.9]), hw=P([-157.0,20.5]);
    var dx=0, dy=0;
    var pm=d3.geo.path().projection(P), ph=d3.geo.path().projection(mk().translate([dx,dy]));
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    topojson.feature(topo,topo.objects.usa).features.forEach(function(f){
      var b=(isHI(f)?ph:pm).bounds(f);
      x0=Math.min(x0,b[0][0]);y0=Math.min(y0,b[0][1]);x1=Math.max(x1,b[1][0]);y1=Math.max(y1,b[1][1]);
    });
    var k=0.94/Math.max((x1-x0)/w,(y1-y0)/h), t=[(w-k*(x0+x1))/2,(h-k*(y0+y1))/2];
    var Pm=d3.geo.azimuthalEqualArea().rotate([100,-45]).scale(U*k).translate(t);
    var Ph=d3.geo.azimuthalEqualArea().rotate([100,-45]).scale(U*k).translate([t[0]+dx*k,t[1]+dy*k]);
    var pM=d3.geo.path().projection(Pm), pH=d3.geo.path().projection(Ph);
    var pick=function(d){return isHI(d)?pH:pM;};
    var f=function(d,i){return pick(d)(d,i);};
    ['centroid','bounds','area'].forEach(function(n){f[n]=function(d){return pick(d)[n](d);};});
    f.projection=function(){return Pm;};
    curP=Pm;
    return {path:f,projection:Pm};
  }
  function init(){
    var el=document.getElementById('map'); el.innerHTML='';
    map=new Datamap({
      element:el, scope:'usa', responsive:false, setProjection:build,
      fills:{defaultFill:css('--land')},
      geographyConfig:{borderColor:css('--line'),borderWidth:0.8,highlightFillColor:css('--hi'),highlightBorderColor:css('--ink'),popupOnHover:false,highlightOnHover:false}
    });
    svg=map.svg;
    if(WT){
      // Every other country, clipped 108° from the map centre so the Pacific (Guam, Samoa) has real context but the far side of the globe isn't smeared.
      var cp=d3.geo.azimuthalEqualArea().rotate([100,-45]).scale(curP.scale()).translate(curP.translate()).clipAngle(108);
      var lp=d3.geo.path().projection(cp);
      var cf=topojson.feature(WT,WT.objects.world).features.filter(function(f){return f.id!=='USA'&&!TERR_ID[f.id];});
      svg.insert('g',':first-child').attr('class','ctx').selectAll('path').data(cf).enter().append('path').attr('d',lp);
    }
    zoom=d3.behavior.zoom().scaleExtent([0.15,60]).on('zoom',function(){
      svg.selectAll('g').filter(function(){return this.parentNode===svg.node();}).attr('transform','translate('+d3.event.translate+')scale('+d3.event.scale+')');
      sc=d3.event.scale;scaleUI();
    });
    svg.call(zoom).on('dblclick.zoom',null);
    el.onmousedown=function(e){dn={x:e.clientX,y:e.clientY,t:Date.now()};};
    // Capture phase: a quick second tap is kept away from d3's built-in double-tap zoom, so it reaches our double-tap handler instead.
    var tt={t:0,x:0,y:0};
    el.addEventListener('touchstart',function(e){
      var p=e.touches[0],now=Date.now();
      if(e.touches.length===1&&now-tt.t<450&&Math.abs(p.clientX-tt.x)+Math.abs(p.clientY-tt.y)<30)e.stopPropagation();
      tt=e.touches.length===1?{t:now,x:p.clientX,y:p.clientY}:{t:0,x:0,y:0};
      dn={x:p.clientX,y:p.clientY,t:now};
    },{passive:true,capture:true});
    layers();paint();
    // One tap handler for the whole map: states, territories, or "outside the USA" (sea, lakes, other countries).
    svg.on('click.sel',function(){
      var e=d3.event;if(!real(e))return;
      var n=e.target,st=d3.select(n).classed('datamaps-subunit')?d3.select(n).datum():null,tk=null;
      for(var m=n;m&&m!==svg.node();m=m.parentNode){if(m.getAttribute&&m.getAttribute('data-t')){tk=m.getAttribute('data-t');break;}}
      if(quiz.on){if(st)answer(st);return;}
      var key=st?'s:'+st.id:tk?'t:'+tk:'out',now=Date.now(),dbl=last.key===key&&now-last.t<450&&Math.abs(e.clientX-last.x)+Math.abs(e.clientY-last.y)<30;
      last=dbl?{key:null,t:0,x:0,y:0}:{key:key,t:now,x:e.clientX,y:e.clientY};
      if(st){choose({type:'s',id:st.id,name:st.properties.name,f:st});if(dbl)openCard(st.id);}
      else if(tk){var td=TDK[tk];choose({type:'t',id:tk,name:td.n});if(dbl)openCard(tk.toUpperCase());}
      else if(dbl)choose(null);
    });
    if(cur)choose(cur);
  }
  var last={key:null,t:0,x:0,y:0},cur=null;
  // Select a state/territory (or clear with null): name in the panel, highlight, and the 2-letter code over a state.
  function choose(s){
    cur=s;
    document.getElementById('name').textContent=s?s.name:'United States';
    svg.selectAll('.sab').remove();
    svg.selectAll('.terr .on').classed('on',false);
    if(s&&s.type==='s'){
      var p=labelAt(s.f);
      svg.append('g').attr('class','sab').append('text').attr('text-anchor','middle').text(s.id)
        .attr('data-x',p[0]).attr('data-y',p[1]).attr('data-dx',0).attr('data-dy',5).attr('data-z',0).attr('data-s',15);
      var t=zoom.translate();svg.select('.sab').attr('transform','translate('+t+')scale('+sc+')');
    } else if(s){svg.selectAll('.terr [data-t="'+s.id+'"]').filter('.mk,path').classed('on',true);}
    paint();scaleUI();
  }
  // ---- State cards ----
  // id: [name, capital, lat, lon, name font (Google Fonts, each used once), weight, flag colour 1 (frame), flag colour 2 (accent)]
  var CD={
   AL:['Alabama','Montgomery',32.377,-86.300,'Fraunces',900,'#8f1d2c','#c9a227'],
   AK:['Alaska','Juneau',58.302,-134.420,'Alfa Slab One',400,'#0f204b','#ffb81c'],
   AZ:['Arizona','Phoenix',33.448,-112.074,'Bungee',400,'#002868','#ce5c17'],
   AR:['Arkansas','Little Rock',34.746,-92.290,'Archivo Black',400,'#a50f2d','#1f3a8a'],
   CA:['California','Sacramento',38.576,-121.494,'Pacifico',400,'#9b1b30','#5b7f3a'],
   CO:['Colorado','Denver',39.739,-104.990,'Bowlby One',400,'#002868','#ffd200'],
   CT:['Connecticut','Hartford',41.764,-72.682,'Cinzel',800,'#0b3d91','#d4af37'],
   DE:['Delaware','Dover',39.158,-75.524,'DM Serif Display',400,'#2e5b9a','#e0c38c'],
   FL:['Florida','Tallahassee',30.438,-84.281,'Righteous',400,'#b5121b','#2a6fb5'],
   GA:['Georgia','Atlanta',33.749,-84.388,'Lobster',400,'#002868','#bf0a30'],

  // History and famous landmarks for each card (bottom-left section).
  var HL={
   AL:['The Creek, Cherokee, Choctaw and Chickasaw peoples lived here first. Alabama became a state in 1819, and cotton farms shaped its early years. In 1955, Rosa Parks refused to give up her bus seat in Montgomery, helping start the Civil Rights Movement. Today, Huntsville helps build rockets for NASA.',['U.S. Space & Rocket Center','Edmund Pettus Bridge','USS Alabama','Gulf Shores beaches']],
   AK:['Alaska Native peoples have lived here for over 10,000 years. Russia claimed the land in the 1700s, then sold it to the USA in 1867 for $7.2 million. Gold rushes in the 1890s brought new settlers, and Alaska became the 49th state in 1959. It is by far the biggest state.',['Denali','Glacier Bay National Park','Mendenhall Glacier','Kenai Fjords']],
   AZ:['Ancient Hohokam and Ancestral Puebloan peoples built villages and canals here long ago. Spain and then Mexico ruled the land until the USA gained it in 1848 and 1853. Arizona became the 48th state in 1912, the last of the connected “lower 48.”',['Grand Canyon','Monument Valley','Petrified Forest','Saguaro National Park']],
   AR:['Quapaw, Caddo and Osage peoples lived here before French explorers arrived in the 1600s. The land became American in the 1803 Louisiana Purchase, and Arkansas became a state in 1836. In 1957, nine brave students called the Little Rock Nine helped end school segregation.',['Hot Springs National Park','Crater of Diamonds State Park','Buffalo National River','Little Rock Central High School']],
   CA:['Hundreds of Native tribes lived here before Spain built missions along the coast in the 1700s. California was part of Mexico until 1848 — the same year gold was found at Sutter’s Mill. The Gold Rush brought people from around the world, and it became a state in 1850. Today, more people live here than in any other state.',['Golden Gate Bridge','Yosemite National Park','Hollywood Sign','Redwood National Park']],
   CO:['Ute, Cheyenne and Arapaho peoples lived here, and Ancestral Puebloans built cliff homes at Mesa Verde. The 1858 Pike’s Peak Gold Rush brought thousands of miners. Colorado became a state in 1876, exactly 100 years after the Declaration of Independence, so it is called the “Centennial State.”',['Rocky Mountain National Park','Mesa Verde','Pikes Peak','Garden of the Gods']],
   CT:['Mohegan, Pequot and other peoples lived here when Dutch and English settlers arrived in the 1630s. Its 1639 Fundamental Orders are often called the first written constitution, so it is nicknamed the “Constitution State.” It was one of the 13 original colonies, and it later became famous for making clocks and submarines.',['Mystic Seaport','Mark Twain House','Yale University','Gillette Castle']],
   DE:['Lenape and Nanticoke peoples lived here before Dutch, Swedish and English settlers came. On December 7, 1787, Delaware became the very first state to approve the U.S. Constitution, so it is called “The First State.” The du Pont family’s gunpowder mills on the Brandywine River helped it grow.',['Rehoboth Beach','Hagley Museum','Fort Delaware','First State National Historical Park']],
   FL:['Timucua, Calusa and later Seminole peoples lived here. Spanish explorer Juan Ponce de León named it “La Florida” in 1513, and St. Augustine, founded in 1565, is the oldest city started by Europeans in the mainland USA. Spain gave Florida to the USA in 1821, and it became a state in 1845. Rockets launch to space from Cape Canaveral.',['Everglades National Park','Kennedy Space Center','Walt Disney World','Castillo de San Marcos']],
   GA:['Creek and Cherokee peoples lived here before James Oglethorpe founded the colony in 1733 — the last of the 13 colonies. In 1838, the Cherokee were forced out on the Trail of Tears. Atlanta was burned in the Civil War and later became the birthplace of Martin Luther King Jr. Georgia is famous for peaches and peanuts.',['Savannah Historic District','Stone Mountain','Martin Luther King Jr. National Historical Park','Okefenokee Swamp']],
   HI:['Polynesian voyagers sailed thousands of miles to reach these islands over 1,000 years ago. King Kamehameha I united the islands in 1810. Queen Liliʻuokalani was overthrown in 1893, and the USA took over in 1898. Japan’s attack on Pearl Harbor in 1941 pulled the USA into World War II. Hawaii became the 50th state in 1959.',['Pearl Harbor','Hawaiʻi Volcanoes National Park','Diamond Head','Waimea Canyon']],
   ID:['Shoshone and Nez Perce peoples lived here, and they helped Lewis and Clark cross the mountains in 1805. Settlers came on the Oregon Trail and in gold rushes in the 1860s. Idaho became a state in 1890. Today, it grows about a third of America’s potatoes.',['Shoshone Falls','Craters of the Moon','Sawtooth Mountains','Hells Canyon']],
   IL:['Around 1050, Mississippian people built Cahokia, the largest city north of Mexico at the time. French explorers arrived in 1673, and Illinois became a state in 1818. Abraham Lincoln lived in Springfield before becoming president. Chicago grew into a giant railroad city and built the world’s first skyscraper in 1885.',['Cloud Gate (“The Bean”)','Willis Tower','Cahokia Mounds','Lincoln Home']],
   IN:['Miami, Shawnee and Potawatomi peoples lived here. Indiana was part of the Northwest Territory and became the 19th state in 1816. Abraham Lincoln grew up here as a boy. Nobody knows for sure where the nickname “Hoosier” comes from! The Indianapolis 500 car race has been run here since 1911.',['Indianapolis Motor Speedway','Indiana Dunes','Lincoln Boyhood National Memorial','Soldiers’ and Sailors’ Monument']],
   IA:['Ioway, Meskwaki and Sauk peoples lived here, and the state is named after the Ioway. The land became American in the 1803 Louisiana Purchase, and Iowa became a state in 1846. Its rich, dark soil makes it one of the top farm states — it usually grows the most corn of any state.',['Field of Dreams movie site','Effigy Mounds','Bridges of Madison County','Iowa State Capitol']],
   KS:['Kansa (Kaw), Osage and Wichita peoples lived here, and the state is named after the Kansa. Before statehood, settlers fought over whether to allow slavery, a time called “Bleeding Kansas.” Kansas joined as a free state in 1861, just before the Civil War. It is called the “Wheat State.”',['Flint Hills','Monument Rocks','Dodge City','Eisenhower Presidential Library']],
   KY:['Shawnee and Cherokee peoples hunted here. In 1775, Daniel Boone blazed the Wilderness Road through the Cumberland Gap. Kentucky became the 15th state in 1792 — the first west of the Appalachian Mountains. Abraham Lincoln was born here. The Kentucky Derby horse race has been run every year since 1875.',['Churchill Downs','Mammoth Cave','Cumberland Gap','Fort Knox']],
   LA:['Chitimacha, Choctaw and other peoples lived here. In 1682, France named the land after King Louis XIV. The USA bought it in the 1803 Louisiana Purchase, and Louisiana became a state in 1812. French, Spanish, African and Caribbean cultures mixed here to create Cajun and Creole food, and jazz music was born in New Orleans.',['French Quarter','St. Louis Cathedral','Atchafalaya Basin swamps','Louisiana State Capitol']],
   ME:['Wabanaki peoples, including the Penobscot and Passamaquoddy, have lived here for thousands of years. Maine was part of Massachusetts until 1820, when it became its own state. It is the most eastern state, so it is one of the first places in the USA to see the sunrise. Maine catches most of America’s lobsters.',['Acadia National Park','Portland Head Light','Mount Katahdin','Bar Harbor']],
   MD:['Piscataway and Susquehannock peoples lived here before English colonists arrived in 1634. In the War of 1812, the defense of Fort McHenry in Baltimore inspired Francis Scott Key to write “The Star-Spangled Banner.” Maryland gave land to create Washington, D.C. It is famous for blue crabs from the Chesapeake Bay.',['Fort McHenry','Baltimore Inner Harbor','U.S. Naval Academy','Assateague Island wild horses']],
   MA:['Wampanoag and Massachusett peoples lived here when the Pilgrims landed at Plymouth in 1620. Boston was a center of the American Revolution: the Boston Tea Party happened in 1773, and the first battles were fought at Lexington and Concord in 1775. Harvard, founded in 1636, is the oldest university in the USA.',['Freedom Trail','Plymouth Rock','Cape Cod','Fenway Park']],
   MI:['Anishinaabe peoples — the Ojibwe, Odawa and Potawatomi — lived here. French fur traders came in the 1600s and founded Detroit in 1701. Michigan became a state in 1837. In the 1900s, Detroit became the “Motor City,” where Henry Ford and others built millions of cars. Michigan touches four of the five Great Lakes.',['Mackinac Bridge','Sleeping Bear Dunes','Henry Ford Museum','Pictured Rocks']],
   MN:['Dakota and Ojibwe peoples lived here. The name comes from a Dakota word meaning “sky-tinted water.” Minnesota became a state in 1858, and many settlers came from Norway, Sweden and Germany. It is called the “Land of 10,000 Lakes,” but it actually has more than 11,000!',['Boundary Waters','Lake Itasca (start of the Mississippi)','Split Rock Lighthouse','Mall of America']],
   MS:['Choctaw, Chickasaw and Natchez peoples lived along the river. The state is named after the Mississippi River, from an Ojibwe word meaning “great river.” It became the 20th state in 1817. Mississippi was a key place in the Civil Rights Movement, and it is the birthplace of the blues and of Elvis Presley.',['Vicksburg National Military Park','Natchez Trace Parkway','Elvis Presley Birthplace','Gulf Islands National Seashore']],
   MO:['Osage and Missouria peoples lived here, and the state is named after the Missouria. The land came with the 1803 Louisiana Purchase, and Lewis and Clark started their journey west near St. Louis. Missouri became a state in 1821, and St. Louis became the “Gateway to the West.” Mark Twain grew up in Hannibal.',['Gateway Arch','Mark Twain Boyhood Home','Lake of the Ozarks','Harry S. Truman Library']],
   MT:['Blackfeet, Crow, Cheyenne and other nations lived here. Lewis and Clark crossed Montana in 1805. In 1876, Lakota and Cheyenne warriors defeated Custer’s army at the Battle of the Little Bighorn. Gold and copper mining brought settlers, and Montana became a state in 1889. Its name means “mountainous” in Spanish.',['Glacier National Park','Little Bighorn Battlefield','Going-to-the-Sun Road','Yellowstone’s north entrance']],
   NE:['Pawnee, Omaha, Ponca and Lakota peoples lived here. Pioneers crossed Nebraska on the Oregon, California and Mormon Trails, using Chimney Rock as a guide. The 1862 Homestead Act brought farmers, and the first homestead claim was made here. Nebraska became a state in 1867. It is the only state with a one-house legislature.',['Chimney Rock','Scotts Bluff','Carhenge','Homestead National Historical Park']],
   NV:['Paiute, Shoshone and Washoe peoples lived here. The land became American in 1848. Finding silver at the Comstock Lode in 1859 made Nevada boom, and it became a state in 1864, during the Civil War — so its motto is “Battle Born.” Hoover Dam was finished in 1936, and Las Vegas grew into a world-famous entertainment city.',['Las Vegas Strip','Hoover Dam','Lake Tahoe','Red Rock Canyon']],
   NH:['Abenaki and Pennacook peoples lived here before English settlers arrived in 1623. In January 1776, New Hampshire became the first colony to set up its own government, free from Britain. In 1788, it was the 9th state to approve the Constitution, which made the Constitution official. Its motto is “Live Free or Die.”',['Mount Washington','White Mountains','Franconia Notch','Kancamagus Highway']],
   NJ:['Lenape people lived here before Dutch, Swedish and English settlers came in the 1600s. Many Revolutionary War battles were fought here, including Trenton, after George Washington crossed the Delaware River in 1776. Thomas Edison invented the phonograph at his Menlo Park lab. New Jersey is the most crowded state for its size.',['Atlantic City Boardwalk','Liberty State Park','Cape May','Thomas Edison National Historical Park']],
   NM:['Pueblo peoples have lived here for over 1,000 years, and people still live in Taos Pueblo today. Spain founded Santa Fe around 1610, making it the oldest state capital in the USA. New Mexico became American in 1848 and the 47th state in 1912. The first atomic bomb was tested here in 1945.',['White Sands National Park','Carlsbad Caverns','Taos Pueblo','Albuquerque Balloon Fiesta']],
   NY:['Haudenosaunee (Iroquois) and Lenape peoples lived here. The Dutch founded New Amsterdam in the 1620s, and the English renamed it New York in 1664. New York City was the first U.S. capital, where George Washington became president in 1789. Millions of immigrants arrived through Ellis Island. Today, NYC is the biggest city in the USA.',['Statue of Liberty','Niagara Falls','Empire State Building','Central Park']],
   NC:['Cherokee, Tuscarora and other peoples lived here. In 1587, English settlers started a colony on Roanoke Island and then mysteriously vanished — it is called the “Lost Colony.” North Carolina became the 12th state in 1789. In 1903, the Wright brothers made the world’s first powered airplane flight near Kitty Hawk.',['Wright Brothers National Memorial','Blue Ridge Parkway','Biltmore Estate','Cape Hatteras Lighthouse']],
   ND:['Mandan, Hidatsa, Arikara and Lakota peoples lived here. Lewis and Clark spent the winter of 1804–05 with the Mandan, where they met Sacagawea. North Dakota became a state on the same day as South Dakota in 1889. Theodore Roosevelt was a rancher in its badlands, which are now a national park named after him.',['Theodore Roosevelt National Park','International Peace Garden','Fort Mandan','Enchanted Highway']],
   OH:['Shawnee, Miami and other peoples lived here, along with ancient mound builders. In 1803, Ohio became the first state made from the Northwest Territory. Seven U.S. presidents were born in Ohio. It is a home of flight: the Wright brothers were from Dayton, and astronauts Neil Armstrong and John Glenn were from Ohio.',['Rock & Roll Hall of Fame','Cedar Point','Serpent Mound','National Museum of the U.S. Air Force']],
   OK:['Wichita, Caddo and Osage peoples lived here. In the 1830s, the U.S. government forced the Cherokee, Choctaw, Chickasaw, Creek and Seminole nations to move here on the Trail of Tears. In 1889, a land run opened the area to settlers, and Oklahoma became a state in 1907. Its name comes from Choctaw words meaning “red people.”',['Wichita Mountains','Route 66','National Cowboy & Western Heritage Museum','Oklahoma City National Memorial']],
   OR:['Chinook, Klamath and many other peoples lived here. Lewis and Clark reached the Pacific Ocean at the mouth of the Columbia River in 1805. In the 1840s, thousands of pioneers traveled the 2,000-mile Oregon Trail to settle here. Oregon became a state in 1859. Crater Lake is the deepest lake in the USA.',['Crater Lake','Multnomah Falls','Haystack Rock','Mount Hood']],
   PA:['Lenape and Susquehannock peoples lived here. William Penn founded the colony in 1681 as a place of religious freedom. The Declaration of Independence (1776) and the Constitution (1787) were both signed in Philadelphia. The Battle of Gettysburg in 1863 was a turning point of the Civil War. Philadelphia was the U.S. capital for 10 years.',['Liberty Bell','Independence Hall','Gettysburg Battlefield','Fallingwater']],
   RI:['Narragansett and Wampanoag peoples lived here. Roger Williams founded Providence in 1636 as a place where people could worship freely. Rhode Island was the first colony to declare independence, in May 1776, but the last to approve the Constitution, in 1790. It is the smallest state. Slater Mill helped start America’s Industrial Revolution.',['The Breakers (Newport Mansions)','Cliff Walk','WaterFire Providence','Block Island']],
   SC:['Catawba, Cherokee and Yamasee peoples lived here. English colonists founded Charles Town, now Charleston, in 1670. Many Revolutionary War battles were fought here. In 1860, South Carolina was the first state to leave the Union, and the Civil War began at Fort Sumter in 1861. Its flag shows a palmetto tree and a crescent moon.',['Fort Sumter','Rainbow Row','Myrtle Beach','Congaree National Park']],
   SD:['Lakota, Dakota and Arikara peoples lived here, and the Black Hills are sacred to the Lakota. Gold was found in the Black Hills in 1874, bringing a rush of miners. South Dakota became a state in 1889. Mount Rushmore, carved from 1927 to 1941, shows four presidents, and the Crazy Horse Memorial is being carved nearby.',['Mount Rushmore','Badlands National Park','Crazy Horse Memorial','Wind Cave']],
   TN:['Cherokee, Chickasaw and Shawnee peoples lived here. Tennessee became the 16th state in 1796. So many people volunteered to fight in the War of 1812 that it became the “Volunteer State.” Nashville is “Music City,” the home of country music, and Memphis is a birthplace of the blues and rock ’n’ roll.',['Great Smoky Mountains','Graceland','Grand Ole Opry','National Civil Rights Museum']],
   TX:['Caddo, Comanche and Apache peoples lived here. Spain and then Mexico ruled Texas until 1836, when Texans won independence after the Battle of the Alamo and the Battle of San Jacinto. For nine years Texas was its own country, the Republic of Texas, before joining the USA in 1845. That is why its flag has a lone star.',['The Alamo','Space Center Houston','Big Bend National Park','San Antonio River Walk']],
   UT:['Ute, Paiute, Shoshone and Navajo peoples lived here. In 1847, Mormon pioneers led by Brigham Young arrived and founded Salt Lake City. The first railroad across the country was finished at Promontory Summit in 1869 with a golden spike. Utah became a state in 1896. It has five national parks, called the “Mighty Five.”',['Arches National Park','Zion National Park','Bryce Canyon','Great Salt Lake']],
   VT:['Abenaki people lived here. Vermont declared itself an independent country in 1777 and stayed that way until it joined as the 14th state in 1791 — the first after the original 13. Its name comes from French words meaning “green mountain.” Vermont makes more maple syrup than any other state.',['Green Mountains','Lake Champlain','Ben & Jerry’s Factory','Shelburne Farms']],
   VA:['Powhatan peoples lived here when English settlers founded Jamestown in 1607, the first lasting English settlement in America. Virginia is called the “Mother of Presidents” because eight presidents were born here, including George Washington and Thomas Jefferson. The Revolutionary War’s last big battle was at Yorktown in 1781.',['Mount Vernon','Monticello','Colonial Williamsburg','Shenandoah National Park']],
   WA:['Coast Salish, Yakama, Nez Perce and many other peoples lived here. Captain George Vancouver explored the coast in 1792, and Lewis and Clark arrived in 1805. Washington became a state in 1889 and is the only state named after a president. Today, it is home to Boeing, Microsoft and Amazon.',['Space Needle','Mount Rainier','Olympic National Park','Pike Place Market']],
   WV:['Shawnee, Cherokee and other peoples hunted here. West Virginia was part of Virginia until the Civil War. When Virginia left the Union, the western counties broke away and became a new state in 1863. Coal mining shaped its history. It is called the “Mountain State” because it lies completely in the Appalachian Mountains.',['New River Gorge Bridge','Harpers Ferry','Seneca Rocks','The Greenbrier']],
   WI:['Ho-Chunk, Menominee and Ojibwe peoples lived here. French explorer Jean Nicolet arrived in 1634. Wisconsin became the 30th state in 1848. Many settlers from Germany and Scandinavia started dairy farms, so it is called “America’s Dairyland” — and it makes more cheese than any other state.',['Lambeau Field','Door County','Wisconsin Dells','Apostle Islands']],
   WY:['Shoshone, Arapaho, Crow and Lakota peoples lived here. In 1869, Wyoming became the first place in the USA to give women the right to vote, earning the nickname “Equality State.” It became a state in 1890. Yellowstone, created in 1872, was the world’s first national park. Fewer people live in Wyoming than in any other state.',['Yellowstone National Park','Old Faithful','Grand Teton National Park','Devils Tower']],
   DC:['In 1790, Congress chose land along the Potomac River for a new capital, and George Washington picked the spot. Pierre L’Enfant planned its wide streets, and the government moved here in 1800. British troops burned the White House and the Capitol in 1814. D.C. is not part of any state — it is a special federal district.',['The White House','U.S. Capitol','Lincoln Memorial','Washington Monument']],
   PR:['The Taíno people called the island Borikén. Christopher Columbus arrived in 1493, and Spain ruled for 400 years, building forts like El Morro. The USA gained Puerto Rico in 1898 after the Spanish–American War, and Puerto Ricans became U.S. citizens in 1917. Today, its official languages are Spanish and English.',['Old San Juan','El Morro','El Yunque Rainforest','Bioluminescent Bay, Vieques']],
   GU:['The Chamorro people have lived on Guam for about 3,500 years. Ferdinand Magellan landed here in 1521, and Spain ruled for over 200 years. The USA took Guam in 1898. Japan occupied it during World War II until U.S. forces took it back in 1944. Because it is so far west, its motto is “Where America’s Day Begins.”',['Tumon Bay','Two Lovers Point','War in the Pacific National Historical Park','Fort Soledad']],
   VI:['Taíno and Carib peoples lived here before Columbus arrived in 1493. Denmark ruled the islands for over 200 years, and enslaved Africans worked on sugar plantations until they won their freedom in 1848. The USA bought the islands from Denmark in 1917 for $25 million. People drive on the left side of the road here!',['Trunk Bay','Magens Bay','Virgin Islands National Park','Christiansted']],
   MP:['Chamorro and later Carolinian peoples lived on these islands. They were ruled by Spain, then Germany, then Japan. In 1944, U.S. forces captured Saipan and Tinian in World War II battles, and the planes that dropped atomic bombs on Japan took off from Tinian. In 1978, the islands became a U.S. commonwealth.',['Managaha Island','Banzai Cliff','The Grotto','North Field, Tinian']],
   AS:['Polynesian people settled the Samoan islands about 3,000 years ago. In 1900, local chiefs signed the island of Tutuila over to the USA, and the Manuʻa Islands followed in 1904. Pago Pago has one of the deepest harbors in the South Pacific. It is the only U.S. territory with people living south of the equator.',['National Park of American Samoa','Pago Pago Harbor','Ofu Beach','Rainmaker Mountain']]

      L.append('text').attr('class',d[4]).attr('text-anchor','middle').text(d[0]).attr('data-x',p[0]).attr('data-y',p[1]).attr('data-dx',0).attr('data-dy',0).attr('data-z',d[3]).attr('data-s',d[4]==='w'?12:11);
    });
    scaleUI();
  }
  // ---- State and Seek ----
  function paint(){
    if(!svg)return;
    var sub=svg.selectAll('.datamaps-subunit');
    sub.classed('flash',false).style('fill',css('--land'));
    if(!quiz.on&&cur&&cur.type==='s')sub.filter(function(g){return g.id===cur.id;}).style('fill',css('--hi'));
    if(quiz.on&&quiz.done&&quiz.cur){
      sub.filter(function(g){return g.id===quiz.cur.id;}).style('fill','#4caf6a').classed('flash',true);
      if(quiz.bad)sub.filter(function(g){return g.id===quiz.bad;}).style('fill','#d9534f');
    }
  }
  function fb(cls,txt){var f=document.getElementById('qfb');f.className='fb';f.textContent=txt;if(cls){void f.offsetWidth;f.className='fb '+cls;}}
  function score(){document.getElementById('qscore').textContent='Score '+quiz.ok+' / '+quiz.n;}
  function nextQ(){
    var q=document.getElementById('qtext'),nb=document.getElementById('qnext');
    quiz.done=0;quiz.bad=null;fb('','');nb.hidden=true;
    if(!quiz.deck.length){
      quiz.cur=null;quiz.finished=1;q.textContent='Round complete!';fb('ok','You got '+quiz.ok+' of '+quiz.n+' right.');
      nb.textContent='Play again';nb.hidden=false;paint();score();return;
    }
    quiz.finished=0;quiz.cur=quiz.deck.pop();q.textContent='Where is '+quiz.cur.name+'?';nb.textContent='Next';paint();score();
  }
  function startQuiz(){
    var d=topojson.feature(topo,topo.objects.usa).features.filter(function(f){return f.id!=='DC';}).map(function(f){return {id:f.id,name:f.properties.name};});
    for(var i=d.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=d[i];d[i]=d[j];d[j]=t;}
    choose(null);quiz.deck=d;quiz.ok=0;quiz.n=0;quiz.on=1;
    document.getElementById('quiz').hidden=false;
    document.getElementById('sas').setAttribute('aria-pressed','true');
    document.getElementById('name').textContent='State and Seek';
    nextQ();
  }
  function stopQuiz(){
    quiz.on=0;quiz.done=0;
    document.getElementById('quiz').hidden=true;
    document.getElementById('sas').setAttribute('aria-pressed','false');
    document.getElementById('name').textContent='United States';
    paint();
  }
  function answer(g){
    if(quiz.done||!quiz.cur)return;
    quiz.n++;quiz.done=1;
    if(g.id===quiz.cur.id){quiz.ok++;quiz.bad=null;fb('ok','\u2713 Correct!');}
    else{quiz.bad=g.id;fb('no','\u2717 That\u2019s '+g.properties.name+'. '+quiz.cur.name+' is shown in green.');}
    var nb=document.getElementById('qnext');nb.textContent=quiz.deck.length?'Next':'See results';nb.hidden=false;
    paint();score();
  }
  document.getElementById('sas').onclick=function(){if(quiz.on)stopQuiz();else startQuiz();};
  document.getElementById('qnext').onclick=function(){if(quiz.finished)startQuiz();else nextQ();};
  document.getElementById('qexit').onclick=stopQuiz;
  function step(f){
    var r=document.getElementById('map').getBoundingClientRect(),k=zoom.scale(),k2=Math.max(1,Math.min(60,k*f)),t=zoom.translate(),c=[r.width/2,r.height/2];
    var x=(c[0]-t[0])/k,y=(c[1]-t[1])/k;
    zoom.scale(k2).translate([c[0]-x*k2,c[1]-y*k2]);
    zoom.event(svg.transition().duration(300));
  }
  // If a place is off-screen, zoom out just enough to fit it alongside the whole USA.
  function show(ll){
    var el=document.getElementById('map'),w=el.offsetWidth,h=el.offsetHeight,p=curP(ll),k=zoom.scale(),t=zoom.translate();
    var sx=p[0]*k+t[0],sy=p[1]*k+t[1];if(sx>20&&sx<w-20&&sy>20&&sy<h-20)return;
    var s=1,x0,x1,y0,y1;
    for(var i=0;i<3;i++){var pad=150/s;x0=Math.min(0,p[0]-pad);x1=Math.max(w,p[0]+pad);y0=Math.min(0,p[1]-pad);y1=Math.max(h,p[1]+pad);s=Math.max(0.15,Math.min(w/(x1-x0),h/(y1-y0)));}
    zoom.scale(s).translate([(w-s*(x0+x1))/2,(h-s*(y0+y1))/2]);zoom.event(svg.transition().duration(700));
  }
  document.getElementById('zi').onclick=function(){step(2);};
  document.getElementById('zo').onclick=function(){step(0.5);};
  document.getElementById('zr').onclick=function(){
    zoom.scale(1).translate([0,0]);zoom.event(svg.transition().duration(400));
    if(!quiz.on)choose(null);
  };
  [].forEach.call(document.querySelectorAll('.opts input'),function(c){
    c.checked=!!sel[c.getAttribute('data-t')];
    c.onchange=function(){var k=c.getAttribute('data-t');sel[k]=c.checked?1:0;if(!c.checked&&cur&&cur.id===k)choose(null);scaleUI();if(c.checked)show(TDK[k].ll);};
  });
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(init,200);});
  init();
})();
</script>
</body>
</html>
